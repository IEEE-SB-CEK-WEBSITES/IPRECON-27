<!-- ════════════════════════════════════════════
     /includes/header.html
     The two-row page header: the thin top bar
     (location / dates / contact + register) and
     the white brand row with the conference logo
     and the sponsor logos.
     The conference logo is a link back to the home
     page, same as the one in the navbar.

     Markup only — styling is in /css/chrome.css.

     Paths are root-relative — a fragment is
     injected at every URL depth, so a leading
     slash is required.
     ════════════════════════════════════════════ -->

<div class="header-top-bar">
  <span>
    <i class="fas fa-map-marker-alt"></i> College of Engineering Karunagappally, Kerala, India
    &nbsp;&nbsp;
    <i class="fas fa-calendar-alt"></i> 15&ndash;17 October 2027
    &nbsp;&nbsp;
    <i class="fas fa-wifi"></i> Hybrid Conference
  </span>
  <span class="htb-right">
    <a href="/contact.html"><i class="fas fa-envelope"></i> Contact Us</a>
    &nbsp;&nbsp;
    <a href="/registration.html"><i class="fas fa-user-plus"></i> Register</a>
  </span>
</div>

<header class="site-header">

    <div class="header-sp-group">
