<!-- ════════════════════════════════════════════
     /includes/nav-marquee.html
     The ticker that runs inside the navbar itself on
     mobile, before the page is scrolled.

     NOTE: navbar.html carries this markup inline
     rather than including this file, so a page that
     includes navbar.html stays two levels deep
     instead of three. Kept for anything that wants
     the ticker on its own. Either way the words come
     from marquee-content-nav.html.
     ════════════════════════════════════════════ -->
<div class="nav-marquee">
  <div class="nav-marquee-track">
<esi:include src="/includes/marquee-content-nav.html" />
<esi:include src="/includes/marquee-content-nav.html" />
  </div>
</div>
